[package]
name = "viper"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui-phosphor = { version = "0.9", features = ["fill"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lofty = "0.25.1"
rayon = "1.12.0"
font-kit = "0.14.3"
notify = "8.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"
discord-rich-presence = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
